<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pencatat Pengeluaran Harian</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            flex: 1;
        }

        button {
            padding: 10px 15px;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #222;
        }

        .expense-item {
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 5px solid #007bff;
        }

        .time {
            font-size: 13px;
            color: gray;
            margin-top: 5px;
        }

        .delete-btn {
            display: inline-block;
            margin-top: 10px;
            text-decoration: none;
            color: red;
            font-size: 14px;
        }

        .delete-btn:hover {
            text-decoration: underline;
        }

        .empty {
            text-align: center;
            color: gray;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Pencatat Pengeluaran Harian</h1>

    <form method="POST" action="/add">

        <input
            type="text"
            name="title"
            placeholder="Nama Pengeluaran"
            required
        >

        <input
            type="number"
            name="amount"
            placeholder="Jumlah"
            required
        >

        <button type="submit">
            Tambah
        </button>

    </form>

    <div class="total">
        Total Pengeluaran: Rp {{ total }}
    </div>

    {% if data %}

        {% for item in data %}

        <div class="expense-item">

            <strong>{{ item[1] }}</strong>
            <br>

            Rp {{ item[2] }}

            <div class="time">
                Waktu: {{ item[3] }}
            </div>

            <a
                class="delete-btn"
                href="/delete/{{ item[0] }}"
            >
                Hapus
            </a>

        </div>

        {% endfor %}

    {% else %}

        <p class="empty">
            Belum ada data pengeluaran.
        </p>

    {% endif %}

</div>

</body>
</html>
